# 分类规则按顺序匹配，第一条命中后停止；未命中使用 fallback。
# match 不同字段同时满足，同一字段的多个值满足任意一个。
# 分类名称直接作为目录名；电影、剧集自动加上对应类型目录。
movie:
  fallback: 其他电影
  rules:
    - name: 动画电影
      match:
        genres: [16]
    - name: 华语电影
      match:
        languages: [zh, cn]

tv:
  fallback: 其他剧集
  rules:
    - name: 动漫
      match:
        genres: [16]
    - name: 纪录片
      match:
        genres: [99]
    - name: 综艺
      match:
        genres: [10764, 10767]
    - name: 国产剧
      match:
        countries: [CN, HK, TW]
    - name: 日韩剧
      match:
        countries: [JP, KR]
    - name: 欧美剧
      match:
        countries: [US, GB, CA, FR, DE, AU]
