root = "."
tmp_dir = "tmp"

[build]
  bin = "tmp\\server.exe"
  cmd = "go build -o tmp\\server.exe ./cmd/server"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "node_modules"]
  exclude_regex = ["_test.go"]
  include_ext = ["go"]
  kill_delay = "500ms"
  log = "air_build.log"
  send_interrupt = true
  stop_on_error = true

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[screen]
  clear_on_rebuild = true
  keep_scroll = true
