<body>
<div class="preview"><div class="preview-inner"><div><strong>交互设计草案</strong>示例数据，操作仅在本页演示</div><div class="row"><label for="scenario">场景</label><select id="scenario"><option value="ready">已绑定，最近检查通过</option><option value="unbound">首次绑定个人网盘</option><option value="prepared">管理员来源，个人网盘已准备</option><option value="pending">换号待确认目录</option><option value="issue">网盘检查异常</option><option value="uncertain">目录创建结果未确认</option><option value="childPending">子账号创建待完成</option><option value="offline">直链服务暂未运行</option></select><button id="theme" class="link" type="button">深色</button></div></div></div>

<main>
<div class="breadcrumb"><span>首页</span><span data-icon="chevron"></span><span>个人中心</span><span data-icon="chevron"></span><span>我的播放</span></div>
<div class="heading"><div><h1>我的播放</h1><p>查看播放来源，管理个人网盘和播放子账号。</p></div><button class="btn icon-btn" type="button" data-action="help" aria-label="播放与网盘使用说明" data-icon="help"></button></div>
<div id="content"></div>
<div class="guide"><button class="link row" data-action="privacy"><span data-icon="shield"></span>个人网盘与隐私说明</button><button class="link row" data-action="help"><span data-icon="help"></span>播放遇到问题？</button><span>个人中心与 Emby 使用相同账号和密码</span></div>
<p class="preview-note">此页用于评审布局和交互；扫码、目录、提交反馈均为本地演示。</p>
</main>
<dialog class="drawer" id="panel" aria-labelledby="panel-title"><div class="frame"><div class="dialog-head"><div><h2 id="panel-title"></h2><p id="panel-subtitle"></p></div><button class="btn icon-btn" type="button" data-action="close" aria-label="关闭面板" data-icon="close"></button></div><div id="panel-body" class="dialog-body"></div><div id="panel-foot" class="dialog-foot"></div></div></dialog>

<script>
const paths={user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>',play:'<rect x="3" y="4" width="18" height="14" rx="3"/><path d="m10 8 5 3-5 3zM8 22h8M12 18v4"/>',drive:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 14h18M16 17h2"/>',folder:'<path d="M3 6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',check:'<path d="m5 12 4 4L19 6"/>',chevron:'<path d="m9 5 7 7-7 7"/>',external:'<path d="M14 3h7v7M21 3l-9 9M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5M5 8a8 8 0 0 1 13-3l2 3M4 16l2 3a8 8 0 0 0 13-3"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6z"/><path d="m8 12 3 3 5-6"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 5M12 17v.2"/>',plus:'<path d="M12 5v14M5 12h14"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v.2"/>',qr:'<path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM14 14h3v3h4v4h-7v-3M21 12v2M12 3v5M3 12h5M12 11v3M10 21v-4"/>',key:'<circle cx="8" cy="8" r="5"/><path d="m12 12 9 9M17 17l3-3M14 14l2-2"/>',pause:'<path d="M8 5v14M16 5v14"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>',unlink:'<path d="m3 3 18 18M10 14l4-4M7 17l-1 1a4 4 0 0 1-6-6l4-4M17 7l1-1a4 4 0 0 1 6 6l-4 4"/>'};

const pill=(text,color='',ico='')=>`<span class="pill ${color}">${ico?icon(ico):''}${text}</span>`;

let state,chosen='',currentChild=0,trigger,toastTimer,qrExpired=false;

function reset(s){state={scenario:s,source:s==='prepared'?'assigned':'personal',uid:s==='unbound'?'':'80001234',directory:s==='unbound'?'':'353251275094300001',connected:s!=='unbound',pending:['pending','uncertain'].includes(s),uncertain:s==='uncertain',issue:s==='issue',enabled:s!=='offline',children:s==='unbound'?[]:s==='childPending'?[{name:'family_room',pending:true}]:s==='ready'?[{name:'family_room'}]:[],limit:2};render()}

function render(){
const status=!state.enabled?'直链服务暂未运行':state.source==='assigned'?'共享池自动调度':!state.uid?'等待绑定个人网盘':state.issue?'网盘检查需要处理':'网盘最近检查通过';

function show(title,subtitle,html,buttons=''){if(!panel.open){trigger=document.activeElement;panel.showModal()}document.querySelector('#panel-title').textContent=title;document.querySelector('#panel-subtitle').textContent=subtitle;body.innerHTML=html;foot.innerHTML=buttons||button('关闭','close');body.scrollTop=0;icons(panel);requestAnimationFrame(()=>{(body.querySelector('input:not([type=checkbox]):not([disabled]),select,button')||panel.querySelector('[data-action=close]')).focus()})}

panel.addEventListener('close',()=>{body.querySelectorAll('input[type=password]').forEach(e=>e.value='');trigger?.isConnected&&trigger.focus()});

function switchSource(){show('切换到我的网盘播放','先确认已绑定的个人网盘与保存目录。',`<div class="detail-row"><span class="label">当前来源</span><strong>${source()}</strong></div><div class="detail-row"><span class="label">切换后</span><strong>我的 115 网盘</strong></div><div class="info stack"><p>后续播放将使用你的个人网盘，文件会保存到专用目录并占用空间。</p><p>此页不提供切回管理员来源的操作。凭据失效后不会自动回退；需要调整时联系管理员。</p><p>子账号仍共享你的个人网盘。播放仍需 Emby 授权。</p></div>`,`${button('取消','close')}${button('确认切换','confirmSwitch','primary')}`)}

function unbind(){show('解除个人网盘绑定','请确认对本人和播放子账号的影响。',`<div class="info stack"><p>${state.source==='personal'?'解绑后，本人新的播放取链将被拒绝，需要重新绑定个人网盘。':'本人当前使用的管理员播放来源不受影响。'}</p><p>共享此个人网盘的子账号将无法发起新的播放请求。</p><p>将清除个人网盘配置、凭据与关联。115 中已有文件保留，已签发直链不保证立即失效。</p></div><label class="check"><input id="unbind-check" type="checkbox">我已了解上述影响，确认解除绑定。</label>`,`${button('保留绑定','close')}<button class="btn danger" data-action="confirmUnbind" id="unbind-submit" disabled>确认解绑</button>`)}

document.addEventListener('change',e=>{if(e.target.id==='scenario'){reset(e.target.value);return}if(e.target.id==='consent')document.querySelector('#qr-next').disabled=!e.target.checked;if(e.target.id==='unbind-check')document.querySelector('#unbind-submit').disabled=!e.target.checked;if(e.target.id==='child-consent')document.querySelector('#child-submit').disabled=!e.target.checked});

if(a==='close')close();else if(a==='bind')bind();else if(a==='qr')qr();else if(a==='manage')manage();else if(a==='directory')directory();else if(a==='switch')switchSource();else if(a==='unbind')unbind();else if(a==='child')childManage();else if(a==='createChild')createChild();else if(a==='retryChild')createChild(true);

else if(a==='submitChild'||a==='childUncertain'){const form=document.querySelector('#child-form');if(!form.reportValidity())return;const retry=document.querySelector('#child-submit').dataset.retry==='true';const name=retry?state.children[currentChild].name:document.querySelector('#child-name').value.trim();if(!name)return;document.querySelector('#child-password').value='';if(retry)state.children[currentChild].pending=a==='childUncertain';else state.children.push({name,pending:a==='childUncertain'});close();render();toast(a==='childUncertain'?'演示：创建结果待确认，请从列表继续原任务。':'演示：创建已完成，使用 Emby 登录。')}
else if(a==='pauseChild'){state.children[currentChild].paused=!state.children[currentChild].paused;render();childManage();toast('演示：共享状态已更新。')}
else if(a==='disableChild'){state.children[currentChild].disabled=!state.children[currentChild].disabled;render();childManage();toast('演示：登录状态已更新。')}
else if(a==='password')show('重置子账号密码',state.children[currentChild].name,`<form id="password-form"><label class="field">新密码<input type="password" minlength="8" maxlength="128" required autocomplete="new-password"></label></form><div class="info">更新密码不保证已登录设备立即退出。需要阻止账号使用时，可停用登录。</div>`,`${button('取消','child')}${button('保存新密码','savePassword','primary')}`);
else if(a==='savePassword'){if(!document.querySelector('#password-form').reportValidity())return;body.querySelector('input').value='';close();toast('演示：密码已更新。')}
else if(a==='revoke')show('永久撤销子账号',state.children[currentChild].name,`<div class="info stack"><p>撤销后释放配额，该身份不能恢复共享。</p><p>保留禁用的 Emby 身份与观看记录，后续播放请求被拒绝，已发出的直链可能仍有效。</p></div>`,`${button('保留账号','child')}${button('确认永久撤销','confirmRevoke','danger')}`);
else if(a==='confirmRevoke'){state.children[currentChild].revoked=true;close();render();toast('演示：子账号已永久撤销，名额已释放。')}
});
document.querySelector('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('#theme').textContent=dark?'浅色':'深色'};
reset('ready');icons();
</script>
</body>
</html>
